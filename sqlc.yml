version: "2"
plugins:
  - name: "py"
    wasm:
      url: https://downloads.sqlc.dev/plugin/sqlc-gen-python_1.0.0.wasm
      sha256: aca83e1f59f8ffdc604774c2f6f9eb321a2b23e07dc83fc12289d25305fa065b
sql:
    gen:
      go:
        package: "orm"
        out: "database/orm"
        emit_exported_queries: true
        emit_interface: true
        overrides:
          - column: "*.id"
            go_type: "string"
