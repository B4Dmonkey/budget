version: "2"
sql:
  - engine: "sqlite"
    queries: "./database/sql"
    schema: "./database/migrations"
    gen:
      go:
        package: "orm"
        out: "database/orm"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
